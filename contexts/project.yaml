# Auto-generated by context sync — 2026-03-14

identity:
  name: nde
  version: 1.0.1
  monorepo: pnpm 10.19 + Turborepo 2.7.6

workspaces:
  apps:
    ui: "@nde/next-gen-tools" — Electron app with floating DevTools
  packages: # none yet

primary_app: ui
stack: Electron 28.3.3, React 19.2.3, Zustand 5.0.9, TailwindCSS 4.1.17, Ant Design 6.1.1, Radix/shadcn, Vite 7.3.0
lang: JavaScript only (.js/.jsx), no TypeScript

rules:
  - Zustand selector pattern: useStore((s) => s.val)
  - React functional components + hooks only
  - HashRouter (Electron requires it)
  - IPC via contextBridge in preload
  - Ant Design for data-heavy, shadcn/ui for primitives
  - One store per domain, views per route, components reusable

commands:
  dev: pnpm ui
  dev_all: pnpm dev
  build: pnpm ui:build:win | ui:build:mac | ui:build:linux
  test: pnpm test
  mcp: cd apps/ui && pnpm mcp:sse
  generators: pnpm gen
  bmad_install: pnpm bmad:install
  bmad_update: pnpm bmad:update

# Context structure:
# contexts/tech.yaml          — monorepo-level deps
# contexts/prd.yaml           — product roadmap (from BMAD or manual)
# contexts/ui/architecture.yaml — apps/ui/ stores, routes, views, components
# contexts/ui/features.yaml    — apps/ui/ feature areas, tests
# contexts/ui/tech.yaml        — apps/ui/ dependencies
# contexts/{new-app}/          — auto-created per workspace
